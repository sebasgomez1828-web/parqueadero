<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Parqueadero Amazonas</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a1b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Parqueadero">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
/* VOICE professional booth software: calm, exact, quick under pressure
   IDEA a cash register counter: plate in on the left, cars waiting to pay on the right, the till below
   PICTURE the Ecuadorian plate input and the live list of cars with a one-tap charge button
   COLOUR the logo: asphalt navy ground with stall lines, navy header with yellow curb stripe, white cards, yellow for money to collect
   TYPE Manrope + JetBrains Mono for plates
   LAYOUT laptop: entry 5 / inside 7, caja full width below; phone: one column, entry then inside */
:root{color-scheme:light dark;--navy:#0b2552;--navy2:#0a1b3a;--yel:#f6b500;--bg:#13284d;--card:light-dark(#fff,#111d36);--soft:light-dark(#f3f5f9,#18264a);--ink:light-dark(#0b1a36,#eef2f8);--mute:light-dark(#5d6b82,#9aa8bf);--line:light-dark(#e1e6ee,#263760);--blue:#0d3a85;--blueS:light-dark(#e7eef9,#1b3266);--blueT:light-dark(#0d3a85,#a9c3f5);--cone:#f6b500;--coneS:light-dark(#fff6d9,#3a2f0c);--ok:light-dark(#0f8a4c,#43d08b);--okS:light-dark(#e7f6ee,#0f2a1d);--bad:#d6361a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
html{background:#13284d}
body{background:repeating-linear-gradient(90deg,transparent 0 150px,rgba(255,255,255,.07) 150px 154px),linear-gradient(180deg,#0f2347 0,#16305c 55%,#1b3768 100%);min-height:100vh;color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.wrap{max-width:1200px;margin:0 auto;padding:0 max(4vw,16px)}
header{padding-top:env(safe-area-inset-top);background:var(--navy2);color:#fff;border-bottom:5px solid var(--yel);box-shadow:0 6px 20px rgba(0,0,0,.25)}
header .sub{color:rgba(255,255,255,.72)}
header .kpi span{color:rgba(255,255,255,.68)}
header .kpi.money b{color:var(--yel)}
header .save{color:#5fe39a}header .save.busy{color:rgba(255,255,255,.7)}header .save.err{color:#ff8a73}
main{position:relative}
main::before{content:'';position:absolute;left:0;right:0;top:0;height:14px;background:repeating-linear-gradient(90deg,var(--yel) 0 46px,transparent 46px 80px);opacity:.9}
.hd{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between;padding-block:16px}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:56px;height:56px;border-radius:14px;flex:none;object-fit:cover;box-shadow:0 0 0 3px var(--yel),0 4px 14px rgba(0,0,0,.35);background:#fff}
.sign{width:44px;height:44px;border-radius:11px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;font-size:27px;flex:none;box-shadow:inset 0 0 0 3px #fff,0 0 0 1.5px var(--blue)}
h1{margin:0;font-size:clamp(20px,2.6vw,25px);line-height:1.1;letter-spacing:-.025em;font-weight:800}
.sub{font-size:13px;color:var(--mute);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.save{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ok)}
.save::before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor}
.save.busy{color:var(--mute)}.save.busy::before{animation:pulse 1s infinite}
.save.err{color:var(--bad)}
@keyframes pulse{50%{opacity:.25}}
.kpis{display:flex;gap:6px 30px;flex-wrap:wrap}
.kpi b{display:block;font-size:22px;line-height:1.15;font-weight:800;letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--mute);font-weight:600}
.kpi.money b{color:var(--ok)}
main{padding-block:34px 48px}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 2px 4px rgba(0,0,0,.08),0 14px 34px rgba(0,0,0,.22)}
.card+.card,.mt{margin-top:20px}
h2{font-size:17px;margin:0;letter-spacing:-.01em;font-weight:800}
.chd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pill{background:var(--blueS);color:var(--blueT);font-weight:800;font-size:13px;border-radius:99px;padding:3px 11px;white-space:nowrap}
label{display:block;font-size:13px;font-weight:700;color:var(--mute);margin:16px 0 6px}
input,select{width:100%;height:48px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);padding:0 12px;font-size:16px}
input:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blueS)}
/* placa */
.plate{border:3px solid #111;border-radius:13px;background:#fff;color:#111;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.plate:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px var(--blueS)}
.plate .strip{background:#f3f4f6;border-bottom:2px solid #111;font:800 11px Manrope,sans-serif;letter-spacing:.04em;text-align:center;padding:3px 0;color:#333}
.plate:focus-within .strip{border-bottom-color:var(--blue)}
.plate input{border:0;height:auto;background:#fff;color:#111;box-shadow:none;text-align:center;font:700 clamp(32px,6vw,44px)/1 'JetBrains Mono',monospace;letter-spacing:.05em;text-transform:uppercase;padding:10px 4px 12px}
.plate input::placeholder{color:#cdd2d9}
.pin{display:flex;justify-content:center;align-items:center;background:#fff}
.pin input{width:auto;flex:none}
.pin .dash{font:700 clamp(30px,6vw,40px)/1 'JetBrains Mono',monospace;color:#111}
.plate.out{border-color:var(--line);border-width:2px}
.plate.out .strip{display:none}
.plate.out,.plate.out input{background:var(--card);color:var(--ink)}
.plate.out input{font-size:22px;padding:11px 12px 11px 42px;text-align:left}
.plate.out:focus-within{border-color:var(--cone);box-shadow:0 0 0 4px var(--coneS)}
.srch{position:relative}
.srch svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:19px;height:19px;stroke:#8a94a3;fill:none;stroke-width:2.2;stroke-linecap:round;z-index:1}
.frec{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.frec:empty{display:none}
.frec small{width:100%;font-size:12px;color:var(--mute);font-weight:700}
.chip{height:36px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);padding:0 10px;font:700 13px 'JetBrains Mono',monospace;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--blue);color:var(--blueT)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg button{border:1.5px solid var(--line);border-radius:13px;background:var(--card);cursor:pointer;font-weight:800;font-size:14px;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:1px;transition:border-color .15s,background .15s}
.seg svg,.ic svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seg svg{width:34px;height:22px;margin-bottom:2px}
.seg small{font-size:12px;color:var(--mute);font-weight:600}
.seg button:hover{border-color:var(--blue)}
.seg button[aria-pressed=true]{border-color:var(--blue);background:var(--blueS);color:var(--blueT)}
.btn{height:54px;border:0;border-radius:13px;padding:0 20px;font-weight:800;cursor:pointer;background:var(--blue);color:#fff;font-size:16px;letter-spacing:-.01em;box-shadow:0 6px 16px rgba(11,37,82,.3);transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.985)}
.btn.cone{background:var(--cone);color:#0b1a36;box-shadow:0 6px 16px rgba(246,181,0,.35)}
.ghost{height:48px;border:1.5px solid var(--line);border-radius:11px;padding:0 14px;background:var(--card);cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap}
.ghost:hover{border-color:var(--blue);color:var(--blueT)}
button:focus-visible{outline:3px solid #8fb4ff;outline-offset:2px}
.full{width:100%;margin-top:16px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px}
.msg{font-size:14px;min-height:20px;margin-top:8px;font-weight:600}
.msg.err{color:var(--bad)}
.hint{font-size:13px;color:var(--mute);margin-top:8px}
.more{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.more summary{font-size:14px;font-weight:700;color:var(--mute);cursor:pointer;min-height:34px;display:flex;align-items:center;gap:6px}
.more summary span{color:var(--blueT)}
/* lista adentro */
.rows{margin-top:12px;display:grid;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:4px;align-items:center;min-height:64px;padding:9px 8px 9px 14px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 1px 2px rgba(13,21,36,.04);transition:border-color .15s,background .15s}
.row:hover{border-color:color-mix(in srgb,var(--blue) 30%,var(--line))}
.who{display:grid;gap:5px;justify-items:start;min-width:0;cursor:pointer}
.del{width:36px;height:36px;border:0;border-radius:9px;background:transparent;cursor:pointer;color:var(--mute);display:grid;place-items:center;padding:0}
.del:hover{background:var(--coneS);color:var(--bad)}
.del svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row.conf{grid-template-columns:minmax(0,1fr) auto auto;gap:8px;background:var(--coneS);border-color:var(--cone);animation:none}
.row.conf .q{font-size:14px;font-weight:700;color:var(--ink)}
.row.conf .q small{display:block;font-weight:600;color:var(--mute);font-size:12px}
.no,.si{height:40px;border-radius:10px;padding:0 14px;font-weight:800;font-size:14px;cursor:pointer;border:0}
.no{background:var(--card);border:1.5px solid var(--line)}
.si{background:var(--bad);color:#fff}
.crow{grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;min-height:60px}
.amt{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;margin-right:4px}
.crow .bt{margin-left:0}
.bt{width:34px;height:34px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);cursor:pointer;color:var(--mute);display:inline-grid;place-items:center;padding:0;vertical-align:middle;margin-left:6px;font-weight:800;font-size:12px}
.bt svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bt:hover{border-color:var(--bad);color:var(--bad)}
.bt.warn{width:auto;padding:0 10px;border-color:var(--bad);background:var(--bad);color:#fff}
.row.nuevo{animation:flash 2.4s ease-out}
.row.one{border-color:var(--cone)}
@keyframes flash{0%,30%{background:var(--blueS)}100%{background:var(--card)}}
.row.one{background:var(--coneS)}
.ic{color:var(--mute);display:grid}.ic svg{width:22px;height:15px}
.mp{font:700 14px 'JetBrains Mono',monospace;border:2px solid #111;border-radius:6px;padding:2px 6px;background:#fff;color:#111;white-space:nowrap;letter-spacing:.04em;box-shadow:inset 0 3px 0 #e8ebf0;cursor:pointer}
.tm{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tm b{color:var(--ink);font-weight:700}
.tp{font-style:normal;font-weight:800;font-size:11px;border-radius:6px;padding:2px 6px;margin-right:2px;background:var(--blueS);color:var(--blueT)}
.tp-moto{background:var(--okS);color:var(--ok)}
.tp-camioneta{background:light-dark(#f3ecff,#2a1d45);color:light-dark(#6b3fd6,#c6a8ff)}
.dtop .tp{font-size:14px;padding:5px 10px}
.calc{text-align:center;font-size:14px;color:var(--mute);font-weight:600;margin-top:2px}
.ed{width:36px;height:36px;border:0;border-radius:9px;background:transparent;cursor:pointer;color:var(--mute);display:grid;place-items:center;padding:0}
.ed:hover{background:var(--soft);color:var(--blueT)}
.ed svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cb{height:42px;min-width:116px;border:0;border-radius:10px;background:var(--cone);color:#0b1a36;font-weight:800;font-size:15px;padding:0 14px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:0 3px 10px rgba(246,181,0,.35);transition:transform .1s}
.cb:active{transform:scale(.96)}
.empty{color:var(--mute);padding:26px 16px;text-align:center;font-size:15px}
/* caja */
.estado{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-radius:14px;padding:14px 16px;margin-bottom:14px;background:var(--soft);border:1.5px solid var(--line)}
.estado .et{display:flex;gap:12px;align-items:center}
.estado .dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--mute)}
.estado.abierta{background:var(--okS);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}.estado.abierta .dot{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 22%,transparent)}
.estado.cerrada .dot{background:var(--ink)}
.estado b{display:block;font-size:16px}.estado small{display:block;color:var(--mute);font-size:13px;font-weight:600}
.estado .eb{display:flex;gap:8px;flex-wrap:wrap}
.estado .btn{height:46px;font-size:15px}
.btn.dark{background:var(--ink);color:var(--card);box-shadow:none}
.ptipo{font-size:13px;color:var(--mute);font-weight:600;margin:-6px 0 14px}
.gl{border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.gl div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-bottom:1px solid var(--line);font-size:14px}
.gl div:last-child{border-bottom:0}
.gl .gx{width:32px;height:32px;border:0;background:transparent;border-radius:8px;cursor:pointer;color:var(--mute);font-size:18px}
.gl .gx:hover{background:var(--soft);color:var(--bad)}
.cuadre{border-radius:14px;background:var(--soft);padding:6px 16px;margin-top:14px}
.cuadre div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.cuadre div:last-child{border-bottom:0}
.cuadre .tot{font-weight:800;font-size:18px}
.big-in{font:800 32px Manrope,sans-serif;text-align:center;height:64px;letter-spacing:-.02em}
.dif{text-align:center;font-weight:800;font-size:20px;border-radius:13px;padding:12px;margin-top:10px}
.dif.ok{background:var(--okS);color:var(--ok)}.dif.mas{background:var(--blueS);color:var(--blueT)}.dif.menos{background:var(--coneS);color:var(--bad)}
.aviso{background:var(--coneS);color:light-dark(#9a3412,#ffb38f);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;margin-top:12px}
.quick.q4{grid-template-columns:repeat(4,minmax(0,1fr))}
.histhd{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px}
.histhd .ctl{display:flex;gap:8px;flex-wrap:wrap}
.histhd input{width:auto;height:44px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5em,1fr));gap:10px;margin-bottom:16px}
.sum div{background:var(--soft);border-radius:14px;padding:13px 16px}
.sum div:first-child{background:var(--blue);color:#fff}
.sum div:first-child span{color:#fff;opacity:.85}

.sum b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.sum span{font-size:13px;color:var(--mute);font-weight:600}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:12px;color:var(--mute);font-weight:700;border-bottom:1.5px solid var(--line);padding:8px 6px}
td{padding:9px 6px;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.mono{font-family:'JetBrains Mono',monospace;font-weight:700}
.sigue{height:34px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);font-weight:700;font-size:13px;padding:0 10px;cursor:pointer;white-space:nowrap}
.sigue:hover{border-color:var(--blue);color:var(--blueT)}
.sigue.warn{border-color:var(--cone);color:var(--cone)}
details.card summary{cursor:pointer;font-weight:800;font-size:17px}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(12em,1fr));gap:0 16px}
/* dialogos */
dialog{border:0;border-radius:22px;padding:0;max-width:450px;width:calc(100% - 24px);background:var(--card);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,12,20,.5);backdrop-filter:blur(2px)}
.dlg{padding:22px}
.dtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dtop .mp{font-size:20px;cursor:default}
.x{width:40px;height:40px;border:0;background:var(--soft);border-radius:50%;cursor:pointer;font-size:22px;line-height:1}
.total{text-align:center;margin:18px 0 4px}
.total small{display:block;font-size:13px;color:var(--mute);font-weight:700}
.total b{display:block;font-size:clamp(54px,14vw,70px);font-weight:800;line-height:1.05;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.det{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center;background:var(--soft);border-radius:13px;padding:10px 4px;margin:12px 0 2px}
.det span{display:block;font-size:12px;color:var(--mute);font-weight:600}
.det b{font-size:15px;white-space:nowrap}
.quick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.quick button{height:50px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);cursor:pointer;font-weight:800;font-size:15px}
.quick button.on{border-color:var(--blue);background:var(--blueS);color:var(--blueT)}
.otro{margin-top:8px}
.vuelto{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding:12px 16px;border-radius:13px;font-weight:700}
.vuelto b{font-size:28px;font-variant-numeric:tabular-nums}
.vuelto.ok{background:var(--okS)}.vuelto.ok b{color:var(--ok)}
.vuelto.no{background:var(--coneS)}.vuelto.no b{color:var(--bad)}
.acts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;margin-top:18px}
.acts.a3{grid-template-columns:auto auto minmax(0,1fr)}
.edp{font:700 26px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.06em;text-align:center;height:58px}
.okv{text-align:center;padding-top:6px}
.chk{width:74px;height:74px;border-radius:50%;background:var(--okS);display:grid;place-items:center;margin:0 auto 10px}
.chk svg{width:38px;height:38px;stroke:var(--ok);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.okv h3{margin:0;font-size:16px;color:var(--mute);font-weight:700}
.okv .big{display:block;font-size:58px;font-weight:800;letter-spacing:-.035em;line-height:1.1;font-variant-numeric:tabular-nums}
.acts3{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.acts3 .btn{grid-column:1/-1}
pre.ticket{background:#fff;color:#111;font:700 14px/1.5 'JetBrains Mono',monospace;padding:16px;border-radius:10px;border:1px dashed #9aa3ad;white-space:pre-wrap;margin:14px 0 0}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#0d1524;color:#fff;padding:10px 10px 10px 16px;border-radius:14px;display:none;gap:6px;align-items:center;z-index:20;width:max-content;max-width:calc(100% - 24px);font-size:15px;font-weight:600;box-shadow:0 12px 34px rgba(0,0,0,.3)}
.toast.on{display:flex}
.toast span{margin-right:6px}
.toast button{background:rgba(255,255,255,.12);border:0;color:#fff;font-weight:800;cursor:pointer;height:36px;padding:0 12px;border-radius:9px;white-space:nowrap}
.toast button.hide{display:none}
.toast button#undo{background:#fff;color:#0d1524}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){
.card{padding:16px;border-radius:16px}.kpis{gap:4px 22px}.kpi b{font-size:19px}
table{font-size:13px}th,td{padding:6px 4px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:2px 0}.stack td::before{content:attr(data-l);color:var(--mute)}
.row{padding:9px 6px 9px 12px;gap:2px}.cb{min-width:0;padding:0 12px;font-size:14px;height:46px}.ed,.del{width:32px}.row.conf{grid-template-columns:minmax(0,1fr) auto auto}.no,.si{padding:0 11px}.crow{gap:5px}.crow .sigue{font-size:12px;padding:0 8px}.amt{font-size:15px}.sum{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.sum div{padding:10px 12px}.sum b{font-size:18px}.sum span{font-size:12px}
.quick{grid-template-columns:repeat(3,minmax(0,1fr))}
dialog{margin:auto 0 0;width:100%;max-width:none;border-radius:24px 24px 0 0}.toast{left:12px;right:12px;transform:none;width:auto;max-width:none;font-size:14px}.toast span{flex:1}.toast button{padding:0 10px}.dlg{padding-bottom:max(22px,env(safe-area-inset-bottom))}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.logobox{background:#fff;border-radius:18px;padding:6px 14px;box-shadow:0 0 0 3px var(--yel),0 8px 22px rgba(0,0,0,.35);display:flex;flex:none}
.biglogo{height:76px;width:auto;display:block}
.brand .sub{gap:6px}
.clk{display:inline-grid;color:var(--yel)}.clk svg{width:16px;height:16px}
svg{stroke-linecap:round;stroke-linejoin:round}
.kpi{display:grid;grid-template-columns:auto auto;column-gap:10px;align-items:center;justify-content:start}
.kpi i{grid-row:span 2;width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.1);display:grid;place-items:center;color:var(--yel)}
.kpi i svg,.hi svg,.clk svg,.eico svg,.tm .t svg{stroke:currentColor;fill:none;stroke-width:2}
.kpi i svg{width:20px;height:20px}
.hi{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--navy);color:var(--yel);margin-right:10px;vertical-align:middle;flex:none}
.hi svg{width:18px;height:18px}
h2{display:flex;align-items:center}
.tm .t{display:inline-flex;align-items:center;gap:3px}.tm .t svg{width:13px;height:13px;color:var(--mute)}
.eico{display:block;margin:0 auto 6px;width:44px;height:44px;color:var(--line)}.eico svg{width:44px;height:44px}
.deco{position:absolute;top:-17px;left:-80px;width:72px;height:32px;z-index:2;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));animation:drive 3.2s cubic-bezier(.25,.8,.3,1) .4s forwards}
.deco svg{width:100%;height:100%}
@keyframes drive{to{left:calc(100% - 120px)}}
@media(max-width:600px){.hd{flex-direction:column;align-items:stretch}.brand{flex-direction:column;align-items:center;text-align:center}.brand .sub{justify-content:center}.biglogo{height:96px}.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}.deco{width:58px;height:26px;top:-14px}@keyframes drive{to{left:calc(100% - 80px)}}}
@media(prefers-reduced-motion:reduce){.deco{left:auto;right:24px;animation:none}}

/* fila de vehículo */
.who .l1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dash2{color:var(--mute);font-weight:700}
.tpx{font-size:13px;letter-spacing:.04em;font-weight:800}
.tpx.tp-auto{color:var(--blueT)}.tpx.tp-moto{color:var(--ok)}.tpx.tp-camioneta{color:light-dark(#6b3fd6,#c6a8ff)}
.who .l2{font-size:13px;color:var(--mute)}.who .l2 b{color:var(--ink)}
.who .l3{font-size:14px;color:var(--ink)}.who .l3 b{font-size:16px;font-variant-numeric:tabular-nums}
.cb{letter-spacing:.02em}
.row{align-items:center}
/* historial */
.filt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.filt label{margin:0;font-size:12px;display:grid;gap:4px}
.filt input,.filt select{height:44px}
.anul{opacity:.62}.anul .amt{text-decoration:line-through}
.anb{font-style:normal;font-size:11px;font-weight:800;background:var(--coneS);color:var(--bad);border-radius:6px;padding:2px 6px}
.por{color:var(--mute)}
/* confirmar cobro */
.kv2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
.kv2 div{background:var(--soft);border-radius:12px;padding:9px 12px}
.kv2 span{display:block;font-size:12px;color:var(--mute);font-weight:600}
.kv2 b{font-size:15px}.kv2 .w2{grid-column:1/-1}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg2 button{height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-weight:800;cursor:pointer}
.seg2 button[aria-pressed=true]{border-color:var(--blue);background:var(--blueS);color:var(--blueT)}
.btn:disabled{opacity:.6;cursor:default}
/* tarifas */
.tt{width:100%;border-collapse:collapse;margin-top:10px}
.tt th{font-size:12px;color:var(--mute);text-align:left;padding:6px}
.tt td{padding:5px 6px;border-bottom:1px solid var(--line)}
.tt select{height:42px;font-size:13px;padding:0 6px}
.tt input:disabled{opacity:.35}
.tt input{height:42px;padding:0 6px;font-size:15px;min-width:58px;text-align:right;font-variant-numeric:tabular-nums}
.tt.prev td{font-size:14px}
.sub3{font-size:15px;margin:22px 0 4px}
@media(max-width:600px){
.filt{grid-template-columns:1fr 1fr}
.row:not(.conf):not(.crow){grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"who ed del" "cb cb cb";row-gap:8px}
.row:not(.conf):not(.crow) .who{grid-area:who}.row:not(.conf):not(.crow) .ed{grid-area:ed}.row:not(.conf):not(.crow) .del{grid-area:del}
.row:not(.conf):not(.crow) .cb{grid-area:cb;width:100%;height:48px;font-size:16px}
.crow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"who amt" "acc acc"}
.crow .who{grid-area:who}.crow .amt{grid-area:amt}
.kv2 b{font-size:14px}
}
</style>

/* TARIFA (editable en Configuración, todo en centavos enteros para no perder ni un centavo):
   0 a 30 min = t30 · 31 a 59 min = t59 · 60 min = h1 (tarifa de la hora)
   desde el minuto 61: + extra15 por cada bloque de 15 minutos o fracción (61-75 = 1 bloque, 76-90 = 2…).
   Los minutos se cuentan completos (37 min 50 s = 37 minutos). Sirve para varios días seguidos.
   Tope diario opcional (0 = sin tope). */
function calc(v,fin){
  const c=cfg(),T=c.tarifas[v.tipo]||c.tarifas.auto,ms=Math.max(0,fin-v.entrada),m=Math.floor(ms/60000);
  const t30=cents(T.t30),t59=cents(T.t59),h1=cents(T.h1),q=cents(c.extra15),tope=cents(c.tope);
  /* modo 'bloques' (auto): 0-30 min = t30; luego + extra15 por cada bloque de 15 min o fracción (31-45, 46-60, 61-75…).
     modo 'tabla' (camioneta y moto, sin cambios): 0-30 = t30 · 31-59 = t59 · 60 = h1 · luego + extra15 por bloque. */
  /* modo 'hora' (tarifa definitiva): 0-30 = t30 · 31-59 = t59 · 60 = h1 (primera hora).
     Luego, en cada hora: los primeros 15 min no suben; cada bloque de 15 min siguiente suma extra15 (3 bloques por hora).
     Auto: 1h $1,00 · 1h15 $1,00 · 1h16 $1,25 · 1h31 $1,50 · 1h46 $1,75 · 2h $1,75 · 2h15 $1,75 · 2h16 $2,00. */
  const porHora=mm=>{if(mm<=30)return{t:t30,txt:'0 a 30 min · '+usd(t30/100)};if(mm<=59)return{t:t59,txt:'31 a 59 min · '+usd(t59/100)};const ex=mm-60,k=Math.floor(ex/60),r=ex%60,n=3*k+(r>15?Math.ceil((r-15)/15):0);return{t:h1+n*q,txt:'1ª hora '+usd(h1/100)+(n?' + '+n+' × 15 min ('+usd(n*q/100)+')':'')}};
  const bloque=T.modo==='hora'?porHora:T.modo==='bloques'?mm=>{if(mm<=30)return{t:t30,txt:'0 a 30 min · '+usd(t30/100)};const n=Math.ceil((mm-30)/15);return{t:t30+n*q,txt:'30 min '+usd(t30/100)+' + '+n+' × 15 min ('+usd(n*q/100)+')'}}:mm=>{if(mm<=30)return{t:t30,txt:'0 a 30 min · '+usd(t30/100)};if(mm<=59)return{t:t59,txt:'31 a 59 min · '+usd(t59/100)};if(mm===60)return{t:h1,txt:'1 hora · '+usd(h1/100)};const n=Math.ceil((mm-60)/15);return{t:h1+n*q,txt:'1 hora '+usd(h1/100)+' + '+n+' × 15 min ('+usd(n*q/100)+')'}};
  let r;
  if(tope>0){const d=Math.floor(m/1440),b=bloque(m-d*1440),p=Math.min(b.t,tope);r={t:d*tope+p,txt:(d?d+' día(s) × '+usd(tope/100)+' + ':'')+(p<b.t?'tope del día':b.txt)}}
  else r=bloque(m);
  return{min:m,total:r.t/100,cent:r.t,txt:r.txt};
}
function normPlaca(p){p=p.toUpperCase().replace(/[^A-Z0-9]/g,'');const m=p.match(/^([A-Z]{3})(\d{3,4})$/);return m?m[1]+'-'+m[2]:p}
/* Acepta todos los formatos de Ecuador: autos ABC-1234 / ABC-123, motos AB123C, HH7710, ABC123D, etc. */
function placaOk(p,t){const r=p.replace(/-/g,'');return /^[A-Z0-9]{5,8}$/.test(r)&&/[A-Z]/.test(r)&&/\d/.test(r)}
function aMs(hhmm,ref){const[h,m]=hhmm.split(':').map(Number);const d=new Date(ref);d.setHours(h,m,0,0);if(d.getTime()>ref+60000)d.setDate(d.getDate()-1);return d.getTime()}

/* ---------- guardado seguro: cola en orden, reintentos y aviso ---------- */
let q=Promise.resolve();
const espera=ms=>new Promise(r=>setTimeout(r,ms));
function cola(fn){
  pend++;setStatus();
  q=q.then(async()=>{
    for(let i=0;;i++){
      try{await fn();fallo=false;break}
      catch(e){
        const c=e&&e.code;
        if(c==='invalid_argument'){soloLectura=true;break}
        if(c==='quota_exceeded'){toast('La base de datos está llena');break}
        fallo=true;setStatus();await espera(Math.min(1500*(i+1),8000)+Math.random()*400);
      }
    }
  }).finally(()=>{pend--;setStatus()});
}

function setStatus(txt){
  const el=$('#status');let t=txt,k='';
  if(!t){
    if(soloLectura){t='Solo lectura';k='err'}
    else if(fallo){t='Sin conexión, reintentando…';k='err'}
    else if(pend>0){t='Guardando…';k='busy'}
    else{t=modo==='nube'?'Todo guardado':'Guardado en este celular'}
  }else k='busy';
  el.textContent=t;el.className='save '+k;
}
function iniciarLocal(){
  modo='local';listo=true;
  try{const r=JSON.parse(localStorage.getItem(LS)||'null');if(r&&r.cfg)S=r}catch(e){}
  setStatus();render();
}
async function iniciar(){
  if(!(window.claude&&window.claude.use)){iniciarLocal();return}
  let d=null;try{d=await window.claude.use('db')}catch(e){}
  if(!d){iniciarLocal();return}
  db=d;modo='nube';S={cfg:JSON.parse(JSON.stringify(DEF)),act:{},dias:{}};setStatus('Cargando datos…');render();
  const t=setTimeout(()=>{fallo=true;setStatus()},10000),ok=()=>{clearTimeout(t);fallo=false;listo=true;setStatus()};
  db.doc('config/tarifas').onSnapshot(s=>{if(s.exists)S.cfg=JSON.parse(JSON.stringify(s.data()));render()},e=>console.warn(e));
  db.collection('activos').onSnapshot(s=>{const a={};s.docs.forEach(x=>{if(!cobrados.has(x.id))a[x.id]=x.data()});S.act=a;if(!s.metadata.fromCache)ok();render()},e=>{ok();console.warn(e)});
  subDia();
  try{const u=await window.claude.use('user');if(u&&u.id)uid=await u.id()}catch(e){}
  try{const u=await window.claude.use('user');if(u&&u.can){const w=await u.can('data.write');if(w===false){soloLectura=true;setStatus()}}}catch(e){}
}

const tick=()=>{$('#reloj').textContent=new Date().toLocaleString('es-EC',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});if(!horaManual)$('#hEnt').value=hora(Date.now());cambioDeDia()};
/* Tiempo real: recalcula cada 10 segundos y al volver a la app, sin recargar la página. */
const vivo=()=>{tick();if(!dlg.open){nuevoId='';render()}else if(dlgUpd)dlgUpd()};
tick();setInterval(vivo,10000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)vivo()});
render();iniciar();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
